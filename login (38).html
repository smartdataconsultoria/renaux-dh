<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renaux Service | Entrar</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b1220;--navy-mid:#0f1a2e;--navy-card:#13213a;--navy-border:#1e3050;
  --gold:#c8922a;--gold-light:#e8a93a;--gold-glow:rgba(200,146,42,.15);
  --text:#e8edf5;--text-muted:#5a7299;--danger:#e05555;--green:#34c97e;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Poppins',sans-serif;background:var(--navy);color:var(--text);display:flex;align-items:center;justify-content:center}

/* BG DECORATIVO */
body::before{
  content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse at 20% 50%,rgba(200,146,42,.06) 0%,transparent 60%),
             radial-gradient(ellipse at 80% 20%,rgba(200,146,42,.04) 0%,transparent 50%);
  pointer-events:none;
}

.card{
  background:var(--navy-card);border:1px solid var(--navy-border);
  border-radius:20px;padding:44px 44px 40px;width:100%;max-width:400px;
  box-shadow:0 24px 64px rgba(0,0,0,.5);position:relative;z-index:1;
}

/* LOGO */
.logo{display:flex;align-items:center;gap:12px;margin-bottom:32px}
.logo-icon{
  width:44px;height:44px;background:linear-gradient(135deg,var(--gold-light),var(--gold));
  border-radius:11px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(200,146,42,.35);
}
.logo-icon svg{width:22px;height:22px;fill:#fff}
.logo-txt{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px}
.logo-txt span{color:var(--gold)}

.card-title{font-size:20px;font-weight:700;margin-bottom:6px}
.card-sub{font-size:12px;color:var(--text-muted);margin-bottom:32px}

/* FORM */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text-muted)}
.field input{
  background:var(--navy);border:1px solid var(--navy-border);border-radius:9px;
  color:var(--text);padding:11px 14px;font-size:13px;font-family:'Poppins',sans-serif;
  outline:none;transition:border .2s;
}
.field input:focus{border-color:rgba(200,146,42,.5);box-shadow:0 0 0 3px rgba(200,146,42,.07)}
.field input::placeholder{color:var(--text-muted)}

/* RECUPERAR SENHA */
.forgot{font-size:11px;color:var(--text-muted);text-align:right;cursor:pointer;margin-top:-8px;margin-bottom:20px;display:block}
.forgot:hover{color:var(--gold)}

/* BTN */
.btn{
  width:100%;padding:12px;border-radius:10px;font-size:14px;font-weight:700;
  cursor:pointer;font-family:'Poppins',sans-serif;transition:all .25s;border:none;
  background:linear-gradient(135deg,var(--gold-light),var(--gold));color:#fff;
  box-shadow:0 4px 18px rgba(200,146,42,.35);letter-spacing:.3px;
}
.btn:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 6px 24px rgba(200,146,42,.45)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.5;cursor:default;transform:none}

/* MENSAGENS */
.msg{font-size:12px;padding:10px 14px;border-radius:8px;margin-top:16px;display:none}
.msg.err{display:block;background:rgba(224,85,85,.08);border:1px solid rgba(224,85,85,.25);color:var(--danger)}
.msg.ok{display:block;background:rgba(52,201,126,.08);border:1px solid rgba(52,201,126,.25);color:var(--green)}

/* RODAPÉ */
.footer{margin-top:32px;text-align:center;font-size:10px;color:var(--text-muted)}
.footer span{color:var(--gold)}
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/></svg>
    </div>
    <span class="logo-txt"><span>RENAUX</span> SERVICE</span>
  </div>

  <div class="card-title">Bem-vindo de volta</div>
  <div class="card-sub">Acesse o Portal DH com suas credenciais.</div>

  <div class="field">
    <label>E-mail</label>
    <input type="email" id="email" placeholder="seu@email.com.br" autocomplete="email">
  </div>

  <div class="field">
    <label>Senha</label>
    <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password">
  </div>

  <span class="forgot" onclick="recuperarSenha()">Esqueci minha senha</span>

  <button class="btn" id="btnEntrar" onclick="entrar()">Entrar</button>

  <div class="msg" id="msg"></div>

  <div class="footer">Portal DH · <span>Renaux Service</span></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SB_URL = 'https://jjpnztfpusgtkuolvxvl.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpqcG56dGZwdXNndGt1b2x2eHZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzMzgwOTksImV4cCI6MjA5MzkxNDA5OX0.2Jzr0FIr0_Vi4sncP8mLMDiMb6PvTLcuCw4F7jVklbc';
var sb = supabase.createClient(SB_URL, SB_KEY);

function showMsg(txt, tipo){
  var el = document.getElementById('msg');
  el.textContent = txt;
  el.className = 'msg ' + tipo;
}

async function entrar(){
  var email = document.getElementById('email').value.trim();
  var senha = document.getElementById('senha').value;
  if(!email || !senha){ showMsg('Preencha e-mail e senha.', 'err'); return; }
  var btn = document.getElementById('btnEntrar');
  btn.disabled = true; btn.textContent = 'Entrando…';
  try {
    var { data, error } = await sb.auth.signInWithPassword({ email, password: senha });
    if(error) throw error;
    window.location.href = './index.html';
  } catch(e){
    showMsg(e.message === 'Invalid login credentials' ? 'E-mail ou senha incorretos.' : e.message, 'err');
    btn.disabled = false; btn.textContent = 'Entrar';
  }
}

async function recuperarSenha(){
  var email = document.getElementById('email').value.trim();
  if(!email){ showMsg('Digite seu e-mail acima para recuperar a senha.', 'err'); return; }
  try {
    var { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/index.html'
    });
    if(error) throw error;
    showMsg('Link de recuperação enviado para ' + email, 'ok');
  } catch(e){ showMsg('Erro: ' + e.message, 'err'); }
}

// Enter para entrar
document.addEventListener('keydown', function(e){ if(e.key === 'Enter') entrar(); });

// Se já está logado, redireciona
window.addEventListener('load', async function(){
  try {
    var { data: { session } } = await sb.auth.getSession();
    if(session) window.location.href = './index.html';
  } catch(e){}
});
</script>
</body>
</html>
